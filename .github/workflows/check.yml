# SPDX-License-Identifier: MIT
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The flake checks: the fixtures and the real-world builds from their
  # committed lockfiles, the unit tests, and the negative checks.
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Run the flake checks
        run: nix flake check -L

  # A relock of every fixture reproduces its committed lockfile byte for
  # byte.
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Relock the fixtures
        run: tests/relock-fixtures.sh
      - name: Compare the lockfiles
        run: git diff --exit-code -- 'tests/fixtures/*/mill-purifier.lock.json'

  # Negative tests outside the sandbox.
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Run the negative tests
        run: nix shell 'nixpkgs#python3' -c tests/negative.sh
